[advisories]
ignore = [
    # vulnerabilities
    "RUSTSEC-2026-0258", # h2: h2 unbounded empty DATA frames
    # quick-xml is only listed in Cargo.lock (optional dep of polars-error via a weak feature), it is not compiled
    "RUSTSEC-2026-0194", # quick-xml: Quadratic run time when checking a start tag for duplicate attribute names
    "RUSTSEC-2026-0195", # quick-xml: Unbounded namespace-declaration allocation in `NsReader` enables memory-exhaustion denial of service
    "RUSTSEC-2025-0009", # ring: Some AES functions may panic when overflow checking is enabled.
    "RUSTSEC-2024-0336", # rustls: `rustls::ConnectionCommon::complete_io` could fall into an infinite loop based on network input
    "RUSTSEC-2026-0349", # rustls: Unauthenticated ServerHello can downgrade later connections to classical key exchange
    "RUSTSEC-2026-0300", # skiplist: Use-after-free in `clear` and `retain` when an element's `Drop` panics
    "RUSTSEC-2026-0409", # skiplist: Use-after-free from a comparator that answers inconsistently

    # unmaintained
    "RUSTSEC-2025-0141", # bincode: Bincode is unmaintained
    "RUSTSEC-2026-0543", # chrono: chrono is unmaintained
    "RUSTSEC-2026-0555", # chrono-tz: chrono-tz is unmaintained
    "RUSTSEC-2026-0542", # humantime: humantime is unmaintained
    "RUSTSEC-2025-0010", # ring: Versions of *ring* prior to 0.17 are unmaintained.
    "RUSTSEC-2022-0071", # rusoto_credential: Rusoto is unmaintained
    "RUSTSEC-2025-0134", # rustls-pemfile: rustls-pemfile is unmaintained
    "RUSTSEC-2024-0449", # unsafe-libyaml: unsafe-libyaml is unmaintained
    "RUSTSEC-2024-0320", # yaml-rust: yaml-rust is unmaintained.

    # unsound
    "RUSTSEC-2026-0408", # skiplist: Aliasing violations in splice, mutable iteration and cursors
]
